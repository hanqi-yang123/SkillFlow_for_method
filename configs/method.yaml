job_name: iter-example-method

agents:
  - import_path: libs.harbor_noinstall_agents.agents:NoInstallHaitunMethod
    # Set these placeholders to the same model/provider used by the Skill and
    # Workflow arms. This example intentionally does not choose a model.
    model_name: YOUR_PROVIDER/YOUR_MODEL
    env:
      PSI_AI_PROVIDER: YOUR_PROVIDER
      PSI_AI_MODEL: YOUR_MODEL
      PSI_AI_API_KEY: "YOUR_API_KEY"
      LLM_API_KEY: "YOUR_API_KEY"
    kwargs: {}

environment:
  allow_internet: true
  force_build: false
  delete: false
  kwargs:
    overlay_base_image: skillflow/haitun-agent-method:ubuntu24.04
    base_image_from: skillflow/harbor-cli-base:ubuntu24.04

orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false

datasets:
  - path: test_tasks/Financial-Statement-Rolling
