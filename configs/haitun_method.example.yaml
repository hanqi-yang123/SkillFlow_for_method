# Portable Haitun + Method example. Export PSI_AI_API_KEY before running.
job_name: haitun-method-example

agents:
  - import_path: libs.harbor_noinstall_agents.agents:NoInstallHaitunMethod
    model_name: claude-opus-5
    env:
      PSI_AI_PROVIDER: anthropic
      PSI_AI_MODEL: claude-opus-5
      PSI_AI_API_KEY: "${PSI_AI_API_KEY}"
      ANTHROPIC_API_KEY: "${PSI_AI_API_KEY}"
    kwargs: {}

environment:
  allow_internet: true
  force_build: false
  delete: false
  kwargs:
    overlay_base_image: skillflow/haitun-agent-method:ubuntu24.04
    base_image_from: skillflow/harbor-cli-base:ubuntu24.04
    mount_targets:
      - /mnt/learning

orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: true

datasets:
  - path: test_tasks/Financial-Statement-Rolling
  - path: test_tasks/Sales-Pivot-Analysis
  - path: test_tasks/Cross-Format-Data-Reconciliation
  - path: test_tasks/SEC-13F-Financial-Analysis
  - path: test_tasks/Document-Fraud-Detection
